<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, modern to-do list." />
  <title>Tasks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f0f1f4;
      --border: #e3e5ea;
      --text: #16181d;
      --muted: #6b7180;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef0ff;
      --danger: #dc2626;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
      --radius: 14px;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-2: #1f232c;
      --border: #2a2f3a;
      --text: #eceef3;
      --muted: #8d93a1;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --accent-soft: #23264a;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 64px 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s ease, color .2s ease;
    }

    .app { width: 100%; max-width: 560px; }

    /* Header */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .date { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }

    .icon-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--muted); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Progress */
    .progress {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 20px;
    }
    .progress-track {
      flex: 1; height: 6px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%; width: 0;
      background: var(--accent);
      border-radius: 99px;
      transition: width .35s cubic-bezier(.4, 0, .2, 1);
    }
    .progress-label { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* New task form */
    .new-task {
      display: flex; gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }
    .new-task input {
      flex: 1;
      font: inherit; font-size: 15px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .new-task input::placeholder { color: var(--muted); }
    .new-task input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .btn-primary {
      font: inherit; font-size: 14px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 18px;
      border: none; border-radius: 10px;
      background: var(--accent); color: #fff;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    [data-theme="dark"] .btn-primary { color: #0f1115; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary svg { width: 16px; height: 16px; }

    /* Filters */
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .filters { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
    .filter {
      font: inherit; font-size: 13px; font-weight: 500;
      padding: 5px 12px;
      border: none; border-radius: 7px;
      background: transparent; color: var(--muted);
      cursor: pointer;
      transition: color .15s, background .15s;
    }
    .filter:hover { color: var(--text); }
    .filter[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .count { font-size: 13px; color: var(--muted); }

    /* List */
    ul { list-style: none; }
    .item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .item.new { animation: in .2s ease; }
    .item:last-child { border-bottom: none; }
    .item:hover { background: var(--surface-2); }
    .item.removing { animation: out .18s ease forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    @keyframes out { to { opacity: 0; transform: translateX(12px); } }

    .check {
      appearance: none; -webkit-appearance: none;
      flex-shrink: 0;
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: grid; place-items: center;
      transition: border-color .15s, background .15s;
    }
    .check:hover { border-color: var(--accent); }
    .check:checked { background: var(--accent); border-color: var(--accent); }
    .check:checked::after {
      content: "";
      width: 10px; height: 6px;
      border: 2px solid var(--surface);
      border-top: none; border-right: none;
      transform: translateY(-1px) rotate(-45deg);
    }
    .check:focus-visible, .icon-btn:focus-visible, .filter:focus-visible, .btn-primary:focus-visible, .link-btn:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    .text {
      flex: 1; min-width: 0;
      font-size: 15px;
      word-break: break-word;
      cursor: text;
      transition: color .15s;
    }
    .item.done .text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }

    .edit {
      flex: 1; min-width: 0;
      font: inherit; font-size: 15px;
      padding: 4px 8px; margin: -5px -9px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--surface); color: var(--text);
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .item:hover .actions, .item:focus-within .actions { opacity: 1; }
    @media (hover: none) { .actions { opacity: 1; } }
    .action {
      width: 30px; height: 30px;
      display: grid; place-items: center;
      border: none; border-radius: 7px;
      background: transparent; color: var(--muted);
      cursor: pointer;
      transition: color .15s, background .15s;
    }
    .action:hover { background: var(--bg); color: var(--text); }
    .action.delete:hover { color: var(--danger); }
    .action svg { width: 16px; height: 16px; }

    /* Empty state */
    .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
    .empty svg { width: 44px; height: 44px; margin-bottom: 12px; opacity: .5; }
    .empty strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
    .empty span { font-size: 14px; }

    /* Footer */
    .footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 13px; color: var(--muted);
    }
    .footer[hidden] { display: none; }
    .link-btn {
      font: inherit; font-size: 13px;
      border: none; background: none;
      color: var(--muted); cursor: pointer;
      border-radius: 4px;
    }
    .link-btn:hover { color: var(--danger); }
    .link-btn:disabled { opacity: .4; cursor: default; color: var(--muted); }

    .hint { margin-top: 16px; text-align: center; font-size: 12.5px; color: var(--muted); }
    kbd {
      font-family: inherit; font-size: 11.5px;
      padding: 1px 6px;
      border: 1px solid var(--border); border-bottom-width: 2px;
      border-radius: 5px;
      background: var(--surface);
    }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (max-width: 480px) {
      body { padding: 32px 14px; }
      h1 { font-size: 26px; }
      .btn-primary span { display: none; }
      .btn-primary { padding: 0 14px; }
      .toolbar { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="date" id="date"></div>
        <h1>My Tasks</h1>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
    </header>

    <div class="progress" aria-live="polite">
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <section class="card">
      <form class="new-task" id="new-task" autocomplete="off">
        <label for="new-input" class="sr-only">New task</label>
        <input id="new-input" type="text" placeholder="What needs to be done?" maxlength="200" />
        <button class="btn-primary" type="submit" aria-label="Add task">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add</span>
        </button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="active">Active</button>
          <button class="filter" type="button" data-filter="completed">Completed</button>
        </div>
        <span class="count" id="count"></span>
      </div>

      <ul id="list" aria-label="Tasks"></ul>

      <div class="footer" id="footer">
        <span id="footer-info"></span>
        <button class="link-btn" id="clear-completed" type="button">Clear completed</button>
      </div>
    </section>

    <p class="hint">Double-click a task to edit &middot; <kbd>Enter</kbd> to save &middot; <kbd>Esc</kbd> to cancel</p>
  </main>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'todo-app.tasks';
      const THEME_KEY = 'todo-app.theme';

      const icons = {
        sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
        moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
        empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>'
      };

      // ---- Storage (wrapped so the app still works if storage is blocked) ----
      const store = {
        get(key, fallback) {
          try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
          catch (e) { return fallback; }
        },
        set(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
        }
      };

      // ---- State ----
      let tasks = store.get(STORAGE_KEY, null);
      if (!Array.isArray(tasks)) {
        tasks = [
          { id: uid(), text: 'Welcome! Add your first task above', done: false },
          { id: uid(), text: 'Double-click a task to edit it', done: false },
          { id: uid(), text: 'Tick the circle to mark something complete', done: true }
        ];
      }
      let filter = 'all';
      let editingId = null;
      let newId = null;

      // ---- Elements ----
      const $ = (sel) => document.querySelector(sel);
      const list = $('#list');
      const form = $('#new-task');
      const input = $('#new-input');
      const countEl = $('#count');
      const footer = $('#footer');
      const footerInfo = $('#footer-info');
      const clearBtn = $('#clear-completed');
      const progressBar = $('#progress-bar');
      const progressLabel = $('#progress-label');
      const themeToggle = $('#theme-toggle');

      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function save() { store.set(STORAGE_KEY, tasks); }

      // ---- Theme ----
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.innerHTML = theme === 'dark' ? icons.sun : icons.moon;
        themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(store.get(THEME_KEY, prefersDark ? 'dark' : 'light'));
      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        store.set(THEME_KEY, next);
      });

      // ---- Date ----
      $('#date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

      // ---- Render ----
      function visibleTasks() {
        if (filter === 'active') return tasks.filter(t => !t.done);
        if (filter === 'completed') return tasks.filter(t => t.done);
        return tasks;
      }

      function render() {
        const items = visibleTasks();
        list.innerHTML = '';

        if (items.length === 0) {
          const msgs = {
            all: ['No tasks yet', 'Add something you want to get done.'],
            active: ['All caught up', 'Nothing left to do. Nice work!'],
            completed: ['Nothing completed yet', 'Finished tasks will show up here.']
          };
          const [title, sub] = msgs[filter];
          list.innerHTML = '<li class="empty">' + icons.empty + '<strong></strong><span></span></li>';
          list.querySelector('strong').textContent = title;
          list.querySelector('span').textContent = sub;
        }

        for (const task of items) list.appendChild(renderItem(task));

        // Filters
        document.querySelectorAll('.filter').forEach(btn => {
          btn.setAttribute('aria-pressed', String(btn.dataset.filter === filter));
        });

        // Counts & progress
        const total = tasks.length;
        const done = tasks.filter(t => t.done).length;
        const left = total - done;
        countEl.textContent = left + (left === 1 ? ' task left' : ' tasks left');
        const pct = total ? Math.round((done / total) * 100) : 0;
        progressBar.style.width = pct + '%';
        progressLabel.textContent = done + ' of ' + total + ' done';

        footer.hidden = total === 0;
        footerInfo.textContent = pct + '% complete';
        clearBtn.disabled = done === 0;
      }

      function renderItem(task) {
        const li = document.createElement('li');
        li.className = 'item' + (task.done ? ' done' : '') + (task.id === newId ? ' new' : '');
        li.dataset.id = task.id;

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'check';
        check.checked = task.done;
        check.setAttribute('aria-label', 'Mark "' + task.text + '" as ' + (task.done ? 'not done' : 'done'));
        check.addEventListener('change', () => toggle(task.id));
        li.appendChild(check);

        if (editingId === task.id) {
          const edit = document.createElement('input');
          edit.className = 'edit';
          edit.value = task.text;
          edit.maxLength = 200;
          edit.setAttribute('aria-label', 'Edit task');
          let finished = false;
          const commit = (keep) => {
            if (finished) return;
            finished = true;
            const value = edit.value.trim();
            editingId = null;
            if (keep) {
              if (value) task.text = value;
              else { tasks = tasks.filter(t => t.id !== task.id); }
              save();
            }
            render();
          };
          edit.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') commit(true);
            if (e.key === 'Escape') commit(false);
          });
          edit.addEventListener('blur', () => commit(true));
          li.appendChild(edit);
          requestAnimationFrame(() => { edit.focus(); edit.setSelectionRange(edit.value.length, edit.value.length); });
        } else {
          const text = document.createElement('span');
          text.className = 'text';
          text.textContent = task.text;
          text.addEventListener('dblclick', () => startEdit(task.id));
          li.appendChild(text);

          const actions = document.createElement('div');
          actions.className = 'actions';

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'action';
          editBtn.innerHTML = icons.edit;
          editBtn.setAttribute('aria-label', 'Edit task');
          editBtn.title = 'Edit';
          editBtn.addEventListener('click', () => startEdit(task.id));

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'action delete';
          delBtn.innerHTML = icons.trash;
          delBtn.setAttribute('aria-label', 'Delete task');
          delBtn.title = 'Delete';
          delBtn.addEventListener('click', () => remove(task.id, li));

          actions.append(editBtn, delBtn);
          li.appendChild(actions);
        }
        return li;
      }

      // ---- Actions ----
      function add(text) {
        const task = { id: uid(), text, done: false };
        tasks.unshift(task);
        if (filter === 'completed') filter = 'all';
        newId = task.id;
        save(); render();
        newId = null;
      }

      function toggle(id) {
        const t = tasks.find(t => t.id === id);
        if (t) { t.done = !t.done; save(); render(); }
      }

      function startEdit(id) { editingId = id; render(); }

      function remove(id, el) {
        const done = () => { tasks = tasks.filter(t => t.id !== id); save(); render(); };
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (el && !reduced) { el.classList.add('removing'); el.addEventListener('animationend', done, { once: true }); }
        else done();
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = input.value.trim();
        if (!value) { input.focus(); return; }
        add(value);
        input.value = '';
        input.focus();
      });

      document.querySelectorAll('.filter').forEach(btn => {
        btn.addEventListener('click', () => { filter = btn.dataset.filter; render(); });
      });

      clearBtn.addEventListener('click', () => {
        tasks = tasks.filter(t => !t.done);
        save(); render();
      });

      render();
      input.focus();
    })();
  </script>
</body>
</html>
